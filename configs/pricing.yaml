# 每 1M tokens 單價(USD)。PLAN.md §7 查證日期:2026-07-19,官方定價頁面。
# 定價會漂移——上游改價時只改這裡,estimated_cost_usd 的計算程式不動。

models:
  mock-deterministic:
    input_per_1m_usd: 0.0
    output_per_1m_usd: 0.0

  gemini-2.5-flash-lite:
    # 仍是官方定價頁上列出的現行方案(2026-07-24 覆查),但這把金鑰打不到
    # (見 models.yaml 的說明)——保留這筆單價供未來換回舊金鑰/帳號時使用。
    input_per_1m_usd: 0.10
    output_per_1m_usd: 0.40

  gemini-3.1-flash-lite:
    # 已驗證(2026-07-24,官方定價頁):目前實際在用的模型。
    input_per_1m_usd: 0.25
    output_per_1m_usd: 1.50

  gemini-3.5-flash-lite:
    # 已驗證(2026-07-26,官方定價頁)。**不是預設**——injection A/B 之後退回 3.1
    # (見 models.yaml 的版本沿革)。單價留著,因為 reports/injection_ab.md
    # 的成本數字出自它,而且之後要重測時不必再查一次。
    # 比 3.1 貴:input 1.2 倍、**output 1.67 倍**。
    input_per_1m_usd: 0.30
    output_per_1m_usd: 2.50

  gpt-5.4-mini:
    input_per_1m_usd: 0.75
    output_per_1m_usd: 4.50
    cached_input_per_1m_usd: 0.075

  gpt-5.4-nano:
    # 已驗證(2026-07-26,官方定價頁)。比 mini 便宜約 3.6 倍,
    # 加進來是為了做全量 eval 的第三欄對照——**不是預設**,
    # models.yaml 沒有動,用 run_eval.py 的 --model-id 覆寫跑。
    input_per_1m_usd: 0.20
    output_per_1m_usd: 1.25
    cached_input_per_1m_usd: 0.02
