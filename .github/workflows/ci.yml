name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # 開發在 Windows、部署在 Linux,兩邊都要綠。Windows 專屬問題(路徑分隔、
    # 檔案鎖語意、cp950 編碼)只有真的在 windows runner 上跑才測得到。
    strategy:
      # 一個 OS 壞掉不要中止另一個——要看到的是「哪個平台壞了」,不是「有東西壞了」
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        # setup-uv v8 起廢除 major tag(@v8 不存在),需釘精確版本
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Sync dependencies
        # --locked:uv.lock 與 pyproject.toml 不同步時直接 fail,不默默重新解析
        #
        # 兩個 extra 都裝:**mypy 需要看得到所有可選依賴**,否則
        # ops/audit/postgres.py 與 scripts/capture_screenshots.py 會回報
        # import-not-found,那兩個檔案等於永遠沒被型別檢查過。
        # 這不代表它們變成必要依賴——「沒裝 postgres extra 也能跑」由
        # tests/test_audit_trail.py 的 TestMissingDriver 蓋住,而 pytest 在這裡
        # 仍然沒有 DATABASE_URL,所以走的是檔案模式;screenshots 只裝 pip 套件,
        # **不下載瀏覽器**(playwright install),因為沒有測試會真的開瀏覽器。
        run: uv sync --locked --extra postgres --extra screenshots

      # 拆成兩個 step 而不是一個 multi-line run:windows runner 預設 shell 是
      # pwsh,只會用「最後一行」的 exit code 決定 step 成敗——寫成兩行的話
      # ruff check 失敗會被後面成功的 ruff format 蓋掉。拆開就與 shell 無關。
      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Lint (ruff format)
        run: uv run ruff format --check .

      - name: Typecheck (mypy)
        run: uv run mypy

      - name: Test (pytest)
        run: uv run pytest
        # CI 一律使用 mock provider,不需要任何 API 金鑰(secret 永不進 CI)

      - name: Eval smoke test (mock provider, committed fixtures)
        # 對 tests/data/fixtures(2 位手工病患)跑一次 CLI,驗證 script 本身(不只函式庫)能跑;
        # 不用真實 100 位病患資料(未進 git,CI 上不存在)。
        # 輸出路徑用 runner.temp 而不是寫死 /tmp:windows runner 沒有 /tmp。
        # 也刻意寫成單行,不用反斜線續行(那是 bash 語法,pwsh 會解析失敗)。
        run: uv run python scripts/run_eval.py --provider mock --data-dir tests/data/fixtures --quality-gate --out "${{ runner.temp }}/ci-eval-smoke.json"

  postgres:
    # 稽核軌跡的 Postgres 後端(營運層 Phase 4)。
    #
    # 為什麼是獨立的 job 而不是加進 check matrix:service container 只在 Linux
    # runner 上可用,而且沒有 DATABASE_URL 的環境本來就跑檔案模式——那條路徑由
    # check job 的一般測試涵蓋。分開跑,兩種模式都有人守著。
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: copilot
          POSTGRES_PASSWORD: copilot
          POSTGRES_DB: copilot
        ports:
          - 5432:5432
        # 沒有 health check 的話,測試會在資料庫還沒接受連線時就開始跑
        options: >-
          --health-cmd "pg_isready -U copilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Sync dependencies (含 postgres extra)
        run: uv sync --locked --extra postgres

      - name: Test (Postgres 稽核後端)
        env:
          DATABASE_URL: postgresql://copilot:copilot@localhost:5432/copilot
        run: uv run pytest tests/test_audit_postgres.py -v

      - name: 稽核鏈驗證程式能跑
        env:
          DATABASE_URL: postgresql://copilot:copilot@localhost:5432/copilot
        run: uv run python scripts/verify_audit_chain.py

  frontend:
    # 前端一直沒有進 CI——**而 Docker build 每次都在跑 `npm run build`**,
    # 所以型別錯誤其實會被 docker job 抓到,只是要等整個 image 建完、
    # 而且錯誤訊息埋在 build log 深處。獨立成一個 job 才會第一時間指出是前端壞了。
    #
    # 2026-07-26 補上單元測試(vitest + @testing-library/react,35 個)。
    # 誠實記錄涵蓋到哪:
    #   - api.ts 的金鑰注入與錯誤翻譯(唯一的注入點,6 個呼叫都走它)
    #   - StatusBar 的降級揭露(demo mode 與真實模式的文案互斥)
    #   - ChatPanel 的錯誤訊息與送出行為
    # **沒有涵蓋**:PatientSelector / PatientTimeline / EvidenceDrawer 的渲染,
    # 以及任何版面行為(自動捲動在 jsdom 裡是 stub 掉的)。
    # 測試檔放在 src/ 底下,所以 `tsc -b` 會一併型別檢查它們;正式 bundle 不受影響。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      # npm ci 而不是 npm install:鎖檔說了算,CI 不該自己解版本
      - name: Install dependencies
        run: npm ci --prefix app

      - name: Lint (oxlint)
        run: npm run --prefix app lint

      - name: Unit tests (vitest)
        run: npm run --prefix app test

      - name: Build (tsc -b + vite build)
        run: npm run --prefix app build

  docker:
    # image 建置只在 Linux 驗證(base image 都是 linux)。這個 job 要抓的是
    # .dockerignore 與 COPY / layer 順序這類與開發機無關的錯誤——正是先前
    # 「用等效方式驗證」抓不到的那一類。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build image
        # 不 push,只驗證建得起來。build 期間會下載 Synthea 樣本資料烤進 image,
        # 所以這個 job 比其他 job 慢得多(數分鐘)。
        #
        # 重試三次的理由:2026-07-28 這個 job 紅過一次,失敗在第一步
        # `load metadata for docker.io/library/node:24-slim` 的 i/o timeout
        # ——Docker Hub 對 runner 的共用 IP 有匿名拉取限制,連 COPY 都還沒發生。
        # 前 7 次全綠,重跑一次就過,是偶發。
        #
        # 重試整個 build(而不是只重試 pull)的取捨:**真的壞掉時不會因此變慢**,
        # 因為 layer cache 會讓第 2、3 次直接跑到上次失敗的那一層;而 BuildKit
        # 解析 base image metadata 是否會退回本機 image 並不確定,所以不靠它。
        #
        # 代價是**重試會遮住間歇性的真實失敗**。所以每次重試都印出來:
        # 如果 log 裡經常看到「第 N 次失敗」,那要去查根因,不是把次數調高。
        run: |
          for attempt in 1 2 3; do
            if docker build -t fhir-care-copilot:ci .; then
              echo "build 成功(第 $attempt 次嘗試)"
              exit 0
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::docker build 連續失敗三次,不是偶發"
              exit 1
            fi
            echo "::warning::docker build 第 $attempt 次失敗,$((attempt * 15)) 秒後重試"
            sleep $((attempt * 15))
          done

      - name: Smoke test the image
        # 光是 build 成功不代表跑得起來——CMD、非 root 使用者、烤進去的資料
        # 三件事都要真的啟動一次才知道。
        run: |
          docker run -d --name copilot-ci -p 7860:7860 fhir-care-copilot:ci
          for _ in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' copilot-ci)
            [ "$status" = "healthy" ] && break
            [ "$status" = "unhealthy" ] && docker logs copilot-ci && exit 1
            sleep 2
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' copilot-ci)" = "healthy"
          curl -sf http://localhost:7860/api/health | tee /dev/stderr | grep -q '"demo_mode":true'
          docker rm -f copilot-ci
