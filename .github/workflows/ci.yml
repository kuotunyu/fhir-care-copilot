name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        # setup-uv v8 起廢除 major tag(@v8 不存在),需釘精確版本
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Sync dependencies
        # --locked:uv.lock 與 pyproject.toml 不同步時直接 fail,不默默重新解析
        run: uv sync --locked

      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Typecheck (mypy)
        run: uv run mypy

      - name: Test (pytest)
        run: uv run pytest
        # CI 一律使用 mock provider,不需要任何 API 金鑰(secret 永不進 CI)

      - name: Eval smoke test (mock provider, committed fixtures)
        # 對 tests/data/fixtures(2 位手工病患)跑一次 CLI,驗證 script 本身(不只函式庫)能跑;
        # 不用真實 100 位病患資料(data/ 未進 git,CI 上不存在)
        run: |
          uv run python scripts/run_eval.py --provider mock \
            --data-dir tests/data/fixtures --out /tmp/ci-eval-smoke.json
