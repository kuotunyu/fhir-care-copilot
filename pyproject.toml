[project]
name = "fhir-copilot"
version = "0.2.0"
description = "可追溯、工具受控、預設唯讀的長照個案查詢 agent(Synthea FHIR R4 合成資料)"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "uvicorn>=0.30",
    "pyyaml>=6.0",
    "google-genai>=1.0",
    "openai>=1.99",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2",
]
# README 的截圖由 scripts/capture_screenshots.py 產生,不是手動截的——UI 改了重跑一次
# 就好。刻意放在 extra 而不是 dev group:CI 用不到,沒必要讓每次 `uv sync` 都拖它。
screenshots = [
    "playwright>=1.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "types-pyyaml>=6.0",
    "httpx2>=2.9.0",
    "huggingface-hub>=1.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fhir_copilot"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF", # ruff 專屬
]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
